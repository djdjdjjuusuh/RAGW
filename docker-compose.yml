services:
  redis:
    image: redis:7-alpine
    container_name: ragw_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: ragw_etcd
    command: ["/usr/local/bin/etcd", "--advertise-client-urls", "http://0.0.0.0:2379", "--listen-client-urls", "http://0.0.0.0:2379"]
    ports:
      - '2379:2379'

  minio:
    image: minio/minio:latest
    container_name: ragw_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: ragw_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: 'http://etcd:2379'
      MINIO_ADDRESS: 'minio:9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: milvus
      DEPLOY_MODE: standalone
      TZ: UTC
    ports:
      - '19530:19530'
    depends_on:
      - etcd
      - minio

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragw_backend
    ports:
      - '8000:8000'
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OPENAI_API_KEY
      - ALLOW_ORIGINS=http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      - EMBEDDING_MODEL=text-embedding-ada-002
      - OPENAI_MODEL=deepseek
    depends_on:
      - redis
      - milvus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragw_frontend
    ports:
      - '4173:4173'
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  redis_data:
  minio_data:
